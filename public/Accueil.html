<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
            font-family: Arial;
        }
        .container { text-align: center; }
        input { width: 200px; padding: 8px; margin-top: 5px; }
        button { margin-top: 15px; padding: 8px 20px; }
    </style>
</head>
<body>

    <div class="container">
        <button id="btnEleve" style="background-color: gray;">Élève</button><button id="btnEnseigant" style="background-color: white;">Enseigant</button>
        <h2 id="typeDeConnexion">Connexion à un élève</h2>

        <label>Usager :</label><br>
        <input type="text" id="usager" name="usager" required><br><br>

        <label>Mot de passe :</label><br>
        <input type="password" id="password" name="password" required>
        <span id="toggleMdp" style="cursor:pointer; margin-left:10px; font-size:20px;">👁️</span><br><br>
        <button type="submit" id="submit" name="submit">Se connecter</button><br><br>

        <label style="color:red;" id="erreur"> </label>
    </div>

    <script>
        const usager = document.getElementById("usager");
        const mdp = document.getElementById("password");
        const btnSeConnecter = document.getElementById("submit");
        const erreur = document.getElementById("erreur");
        const toggleMdp = document.getElementById("toggleMdp");
        const btnEleve = document.getElementById("btnEleve");
        const btnEnseignant = document.getElementById("btnEnseigant");
        const typeDeConnexion = document.getElementById("typeDeConnexion");

        // Changer le type de connexion (Élève/Enseignant)
        btnEleve.addEventListener("click", e => {
            typeDeConnexion.textContent = "Connexion à un élève";
            btnEleve.style.backgroundColor = "gray";
            btnEnseignant.style.backgroundColor = "white";
        });
        btnEnseignant.addEventListener("click", e => {
            typeDeConnexion.textContent = "Connexion à un enseignant";
            btnEnseignant.style.backgroundColor = "gray";
            btnEleve.style.backgroundColor = "white";
        });

        // Afficher/Cacher le mot de passe
        toggleMdp.addEventListener("click", e => {
            if (mdp.type == "password") {
                mdp.type = "text";
            } else {
                mdp.type = "password";
            }
        });

        // Vérifier l'usager et le mot de passe auprès du serveur (base SQLite)
        btnSeConnecter.addEventListener("click", async () => {

            // 1. Vérifier d'abord la connexion internet
            if (!navigator.onLine) {
                erreur.textContent = "Aucune connexion internet. Veuillez vous reconnecter et réessayer.";
                return;
            }

            try {
                const reponse = await fetch("/api/connexion", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usager: usager.value, password: mdp.value })
                });

                const data = await reponse.json();

                if (data.ok) {
                    erreur.textContent = "";
                    localStorage.setItem("token", data.token);
                    window.location.href = "/dashboard.html";
                } else {
                    erreur.textContent = data.message;
                }

            } catch (err) {
                // 2. Le serveur est injoignable ou internet est coupé
                erreur.textContent = "Impossible de joindre le serveur. Vérifiez votre connexion internet.";
            }
        });

        // 3. Réagir en direct quand la connexion change
        window.addEventListener("offline", () => {
            erreur.textContent = "Connexion internet perdue.";
            btnSeConnecter.disabled = true;
        });

        window.addEventListener("online", () => {
            erreur.textContent = "";
            btnSeConnecter.disabled = false;
        });

        // État au chargement de la page
        if (!navigator.onLine) {
            erreur.textContent = "Aucune connexion internet.";
            btnSeConnecter.disabled = true;
        }
        
        // 3. Réagir en direct quand la connexion change
        window.addEventListener("offline", () => {
            erreur.textContent = "Connexion internet perdue.";
            btnSeConnecter.disabled = true;
        });

        window.addEventListener("online", () => {
            erreur.textContent = "";
            btnSeConnecter.disabled = false;
        });

        // État au chargement de la page
        if (!navigator.onLine) {
            erreur.textContent = "Aucune connexion internet.";
            btnSeConnecter.disabled = true;
        }
    </script>
</body>
</html>
