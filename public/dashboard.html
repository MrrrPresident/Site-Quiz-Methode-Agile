
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px;
      background: #f1f2f3;
      color: #222;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 1100px;
      margin: auto;
    }

    h1 { font-size: 26px; margin: 0 0 12px; }
    h2 { font-size: 21px; margin: 0 0 14px; }
    h3 { font-size: 20px; margin: 0 0 14px; }

    .panel, .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 7px #00000012;
    }

    .panel { margin-top: 20px; }
    .card { margin-bottom: 14px; }
    .card p { margin: 8px 0; }

    .actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
}

.deconnexion {
  padding: 10px 12px;
  background: #f4f4f4;
  color: #222;
  border: 1px solid #aaa;
  border-radius: 9px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}

.deconnexion:hover {
  background: #e5e5e5;
}

    .publish {
      display: inline-block;
      padding: 14px;
      color: white;
      background: #292929;
      border: 1px solid #292929;
      border-radius: 9px;
      font-size: 19px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
    }

    .card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

.btn-supprimer {
  padding: 10px 12px;
  color: #222;
  background: white;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 14px;
  font-weight: normal;
  cursor: pointer;
}

.btn-supprimer:hover {
  background: #f4f4f4;
}


    @media (max-width: 760px) {
      body { padding: 16px; }
      .publish { width: 100%; }
    }
  </style>
</head>

<body>
  <main>
    <h1>Tableau de bord de l'enseignant</h1>

    <div class="actions">
 <button type="button" class="deconnexion"
        onclick="localStorage.removeItem('token'); window.location.replace('/Accueil.html');">
    Déconnexion
</button>
  <a href="creation-quiz.html" class="publish">Créer un quiz</a>
</div>

    <section class="panel">
      <h2>Mes quiz</h2>

      <div id="listeQuiz">
        <p>Chargement des quiz...</p>
      </div>
    </section>
  </main>

  <script>
    async function chargerQuiz() {
      const listeQuiz = document.getElementById("listeQuiz");
      const token = localStorage.getItem("token");

      try {
        const reponse = await fetch("/api/quiz", {
          headers: {
            "Authorization": "Bearer " + token
          }
        });

        const resultat = await reponse.json();

        if (!reponse.ok) {
          listeQuiz.textContent = resultat.message || "Impossible de charger les quiz";
          return;
        }

        listeQuiz.innerHTML = "";

        if (resultat.quiz.length === 0) {
          listeQuiz.textContent = "Vous n'avez pas encore créé de quiz.";
          return;
        }

        resultat.quiz.forEach(quiz => {
          const carte = document.createElement("div");
          carte.className = "card";

          const titre = document.createElement("h3");
          titre.textContent = quiz.titre;

          const statut = document.createElement("p");
          statut.textContent = quiz.publie === 1 ? "Publié" : "Brouillon";

         const boutonSupprimer = document.createElement("button");
boutonSupprimer.textContent = "Supprimer";
boutonSupprimer.className = "btn-supprimer";

boutonSupprimer.addEventListener("click", async () => {

    const confirmation = confirm(
        "Voulez-vous vraiment supprimer le quiz : " + quiz.titre + " ?"
    );

    if (!confirmation) {
        return;
    }

    try {
        const reponse = await fetch("/api/quiz/" + quiz.id, {
            method: "DELETE",
            headers: {
                "Authorization": "Bearer " + localStorage.getItem("token")
            }
        });

        const resultat = await reponse.json();

        if (!reponse.ok) {
            alert(resultat.message || "Erreur pendant la suppression");
            return;
        }

        chargerQuiz();

    } catch (erreur) {
        alert("Impossible de communiquer avec le serveur");
        console.error(erreur);
    }
});

const informations = document.createElement("div");

informations.appendChild(titre);
informations.appendChild(statut);

carte.appendChild(informations);
carte.appendChild(boutonSupprimer);

listeQuiz.appendChild(carte);
        });

      } catch (erreur) {
        listeQuiz.textContent = "Erreur de communication avec le serveur";
        console.error(erreur);
      }
    }

    chargerQuiz();
  </script>
</body>
</html>
