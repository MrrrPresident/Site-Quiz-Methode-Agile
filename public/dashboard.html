<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créateur de Quiz</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      background: #f1f2f3;
      color: #222;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: 2fr 0.85fr;
      gap: 28px;
    }
    h1 { font-size: 26px; margin: 0 0 12px; }
    h2 { font-size: 21px; margin: 0 0 14px; }
    h3 { font-size: 20px; margin: 0 0 14px; }
    input, select, button {
      font: inherit;
      border: 1px solid #aaa;
      border-radius: 9px;
      padding: 10px 12px;
    }
    input[type="text"], select { width: 100%; background: white; }
    .panel, .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 7px #00000012;
    }
    .quiz-title { margin-bottom: 16px; }
    .question { margin-top: 16px; }
    .type-row { margin: 14px 0; }
    .type-row label { display: block; margin-bottom: 6px; font-weight: bold; }
    .option { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
    .option input[type="radio"] { width: 20px; height: 20px; }
    .option input[type="text"] { flex: 1; }
    .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
    button { cursor: pointer; background: #f4f4f4; font-weight: bold; }
    aside h2 { text-align: center; margin-bottom: 14px; }
    .card { margin-bottom: 14px; }
    .card p { margin: 8px 0; }
    .publish {
      width: 100%; margin-top: 12px; padding: 14px;
      color: white; background: #292929; border-color: #292929;
      font-size: 19px;
    }
    @media (max-width: 760px) {
      body { padding: 16px; }
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Créateur de Quiz</h1>
      <input class="quiz-title" type="text" placeholder="Titre du quiz" aria-label="Titre du quiz">

      <div class="panel">
        <h2>Ajouter une question</h2>
        <input type="text" placeholder="Énoncé de la question" aria-label="Énoncé de la question">

        <div class="type-row">
          <label for="type">Type de question</label>
          <select id="type">
            <option>Choix multiples</option>
            <option>Vrai/Faux</option>
          </select>
        </div>

        <div class="option"><input type="radio" name="correct" checked aria-label="Bonne réponse A"><input type="text" value="Option A" aria-label="Option A"></div>
        <div class="option"><input type="radio" name="correct" aria-label="Bonne réponse B"><input type="text" value="Option B" aria-label="Option B"></div>
        <div class="option"><input type="radio" name="correct" aria-label="Bonne réponse C"><input type="text" value="Option C" aria-label="Option C"></div>
        <div class="option"><input type="radio" name="correct" aria-label="Bonne réponse D"><input type="text" value="Option D" aria-label="Option D"></div>

        <div class="actions">
          <button type="button">Enlever une option</button><br>
          <button tyoe="button">Ajouter une option</button><br>
          <button type="button">Enregistrer la question</button></div>
      </div>
    </section>

    <aside>
      <h2>Aperçu du Quiz</h2>
      <button class="publish" type="button">Publier le Quiz</button>
    </aside>
  </main>
</body>
</html>
