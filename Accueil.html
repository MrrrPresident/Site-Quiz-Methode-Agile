<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial;
        }

        .container {
            text-align: center;
        }

        input {
            width: 200px;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 8px 20px;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h2>Connexion à un enseignant</h2>
        
        <label>Usager :</label><br>
        <input type="usager" id="usager" name="usager" required><br><br>

        <label>Mot de passe :</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit" id="submit" name="submit">Se connecter</button><br><br>

        <label style="color:red;" id="erreur"> </label>    
    </div>

</body>
</html>
<script>
    const usager=document.getElementById("usager");
    const mdp=document.getElementById("password");
    const btnSeConnecter=document.getElementById("submit");
    const erreur=document.getElementById("erreur");

    btnSeConnecter.addEventListener("click", ()=>{
        if(usager.value!=="Farid"||mdp.value!=="Farid"){
            erreur.textContent="L'usager ou le mot de passe est incorect"
        }
        else{
            erreur.textContent="";
        }
    })
</script>
